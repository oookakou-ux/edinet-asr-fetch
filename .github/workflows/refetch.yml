name: refetch

# C-140 の穴（2026-10-22）: data/edinet/_refetch_ids.txt の有報を取り直し、抽出し直した値で月のファイルの行を差し替える。
# 対象＝売上（5期）・営業利益・EPS・自己資本比率・総資産のどれかが空欄の書類（読み方を足したので埋まる可能性があるもの全部）。
# 前に埋まっていた値は変わらないはず ─ 変わったものは data/edinet/_refetch.json の changed に残る。手動起動のみ。
# 途中で止まっても、起動し直せば続きから（済みの書類は飛ばす）。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edinet-fetch          # 取得（edinet-fetch）と同じ月のファイルを書くので、同時に走らせない
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refetch and commit
        # キーはこの手順にだけ渡す
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          export EDINET_DEADLINE=$(( $(date +%s) + 330 * 60 ))
          rc=0
          python edinet_fin.py --refetch-docs data/edinet/_refetch_ids.txt || rc=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edinet
          if ! git diff --cached --quiet; then
            git commit -q -m "C-140 有報の数値を取り直した（会社独自・米国基準の要素） [automated]"
            ok=0
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && { ok=1; break; }
              git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}" || { git merge --abort || true; echo "🔴 取り込みが食い違った"; exit 1; }
              sleep $(( 5 * i ))
            done
            [[ $ok == 1 ]] || { echo "🔴 push できない"; exit 1; }
          fi
          case $rc in
            0) echo "完了" ;;
            2) echo "⚠ 取れない書類が残った（起動し直せば、その書類だけもう一度取る）"; exit 1 ;;
            3) echo "⏱ 時間切れの前に止めた ─ 起動し直せば続きから" ;;
            *) echo "🔴 想定外の終わり方（rc=$rc）"; exit 1 ;;
          esac

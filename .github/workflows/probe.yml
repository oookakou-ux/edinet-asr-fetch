name: probe

# 指定した有報（docID）の、売上・営業利益に当たりそうな要素を印字する（何も保存しない・手動起動のみ）
on:
  workflow_dispatch:
    inputs:
      docids:
        description: "docID をカンマ区切りで（S + 英数字7文字）"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          DOCIDS: ${{ inputs.docids }}
        run: python edinet_fin.py --probe-docs "$DOCIDS"
